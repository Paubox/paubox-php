# Running the tests
#
#   composer update
#   vendor/bin/phpunit                          # offline only, what CI runs
#   vendor/bin/phpunit --group integration      # needs a live API + real key
#   vendor/bin/phpunit --group destructive      # WRITES TO LIVE DATA, sends mail
#
# The last one creates, updates, archives, and copies real forms, injects real
# submissions, and sends real email against whatever host the SDK points at.
# It has no teardown. Do not run it against production.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the real floor, not a preference. nategood/httpful is pinned at
        # "*", and on PHP < 8.1 the package cannot be installed at all:
        #
        #   - 1.0.0 is the only candidate "*" considers, and it requires php >= 8.1
        #   - every 0.x release is blocked by advisory PKSA-4dtf-ym9h-t41j /
        #     GHSA-gcfg-hmwx-wq5h ("Insecure HTTPS Connections due to Missing
        #     Default Certificate Validation", affects < 1.0.0), which composer
        #     refuses to install by default
        #
        # So `composer update` exits 2 on 7.4 and 8.0 with an error that blames a
        # transitive dependency. composer.json should declare "php": ">=8.1" to
        # make that a clear, up-front constraint instead.
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      # No composer.lock is committed, so this resolves fresh on every run and
      # each PHP version can legitimately get a different dependency set.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      # Record which HTTP client actually got installed. Only 1.0.0 sets
      # $strict_ssl = true by default; every 0.x release ships it false and is
      # covered by GHSA-gcfg-hmwx-wq5h. If this ever prints a 0.x — because a
      # lock file pins one, or advisory blocking was disabled — TLS certificate
      # verification is off for every request this SDK makes.
      - name: Report resolved HTTP client
        run: composer show nategood/httpful | grep -E '^(name|versions)'

      - name: Lint
        run: find src -name '*.php' -print0 | xargs -0 -n1 -- php -l

      # Offline groups only. See phpunit.xml.dist for why integration and
      # destructive are excluded.
      - name: PHPUnit
        run: vendor/bin/phpunit
